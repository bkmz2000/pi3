name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docker-e2e:
    name: Docker E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t pi3:test .

      - name: Start container
        run: |
          docker run -d -p 5173:3001 --name pi3-test pi3:test

      - name: Wait for server ready
        run: |
          for i in {1..30}; do
            curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/api/health | grep -q "200" && break
            sleep 1
          done
          curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/api/health | grep -q "200" || exit 1

      - name: Run E2E tests
        run: PUPPETEER_URL=http://localhost:5173 npm run test:puppeteer
        env:
          PUPPETEER_URL: http://localhost:5173

      - name: Cleanup
        if: always()
        run: docker stop pi3-test
