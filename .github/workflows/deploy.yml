name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_KEY }}
          use_insecure_cipher: true
          script: |
            set -e
            cd /app/pi3

            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
            fi

            git pull origin main

            docker build -t pi3:latest .

            docker stop pi3 2>/dev/null || true
            docker rm pi3 2>/dev/null || true
            docker run -d \
              --name pi3 \
              --restart unless-stopped \
              -p 8080:5173 \
              -v pi3-data:/app/data \
              pi3:latest

      - name: Deployment Summary
        if: success()
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deployed at: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Success" >> $GITHUB_STEP_SUMMARY

      - name: Deployment Failed
        if: failure()
        run: |
          echo "## Deploy Failed" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Failed at: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- Please check server and retry" >> $GITHUB_STEP_SUMMARY