version: '3.8'

services:
  pi3:
    build: .
    image: pi3:latest
    container_name: pi3
    restart: unless-stopped
    ports:
      - "8080:3001"
    volumes:
      - pi3-data:/app/data
      - pi3-db:/app/db
    environment:
      - PORT=3001
      - DB_PATH=/app/db/pi3.db

volumes:
  pi3-data:
    driver: local
  pi3-db:
    driver: local