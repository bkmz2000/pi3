version: '3.8'

services:
  pi3:
    build: .
    image: pi3:latest
    container_name: pi3
    restart: unless-stopped
    ports:
      - "8080:5173"
    volumes:
      - pi3-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  pi3-data:
    driver: local