services:
  pi3:
    image: ghcr.io/bkmz2000/pi3:latest
    container_name: pi3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:3001"
    environment:
      - HOST=0.0.0.0
      - PORT=3001
      - DB_PATH=/app/db/pi3.db
      - SESSION_SECRET=${SESSION_SECRET}
      - APP_BASE_URL=${APP_BASE_URL:-https://pi3.sys5.ru}
      - AUTH_PROVIDER=${AUTH_PROVIDER:-loginus}
      - LOGINUS_DOMAIN=${LOGINUS_DOMAIN:-https://lk.systematika.org}
      - LOGINUS_CLIENT_ID=${LOGINUS_CLIENT_ID}
      - LOGINUS_CLIENT_SECRET=${LOGINUS_CLIENT_SECRET}
      - LOGINUS_TEACHER_ROLE=${LOGINUS_TEACHER_ROLE:-teacher}
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - KEYCLOAK_TEACHER_ROLE=${KEYCLOAK_TEACHER_ROLE:-teacher}
      - KEYCLOAK_TEACHER_GROUP=${KEYCLOAK_TEACHER_GROUP:-}
    env_file:
      - .env
    volumes:
      - pi3-db:/app/db

  # Ad-hoc DB shell. The runtime image ships no sqlite3 binary and neither
  # does the host, so this is the way in:
  #
  #   docker compose run --rm sqlite                       # interactive shell
  #   docker compose run --rm sqlite sqlite3 pi3.db "..."  # one-off query
  #
  # The tools profile keeps it out of `docker compose up`. Writes are safe
  # while pi3 is running — WAL handles the concurrent access — but take a
  # backup first: `.backup pi3.db.bak-$(date +%Y%m%dT%H%M%S)`.
  sqlite:
    image: alpine:3.22
    profiles: ["tools"]
    working_dir: /app/db
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache sqlite >/dev/null && exec \"$0\" \"$@\""]
    command: ["sqlite3", "pi3.db"]
    volumes:
      - pi3-db:/app/db

volumes:
  pi3-db:
    driver: local