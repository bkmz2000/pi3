version: '3.8'

services:
  pi3:
    build: .
    image: pi3:latest
    container_name: pi3
    restart: unless-stopped
ports:
      - "8080:3001"
    expose:
      - "3001"
    environment:
      - HOST=0.0.0.0
      - PORT=3001
      - DB_PATH=/app/db/pi3.db

volumes:
  pi3-data:
    driver: local
  pi3-db:
    driver: local