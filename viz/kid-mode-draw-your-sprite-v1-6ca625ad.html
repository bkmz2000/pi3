<div id="kid-editor" style="font-family: system-ui, sans-serif; color: var(--foreground); display: flex; flex-direction: column; gap: 10px; padding: 2px;">
<style>
  #kid-editor .kd-tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #kid-editor .kd-tool { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--foreground); font-size: 18px; cursor: pointer; line-height: 1; }
  #kid-editor .kd-tool.on { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  #kid-editor .kd-btn { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--foreground); font-size: 13px; cursor: pointer; }
  #kid-editor .kd-btn.on { border-color: var(--primary); color: var(--primary); }
  #kid-editor .kd-main { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
  #kid-editor .kd-canvas-wrap { position: relative; }
  #kid-editor #kd-canvas { width: 384px; height: 384px; max-width: 100%; display: block; image-rendering: pixelated; border: 1px solid var(--border); border-radius: 8px; touch-action: none; user-select: none; cursor: crosshair; background-image: repeating-conic-gradient(light-dark(rgba(0,0,0,.08), rgba(255,255,255,.12)) 0% 25%, transparent 0% 50%); background-size: 16px 16px; }
  #kid-editor .kd-grid { position: absolute; inset: 0; pointer-events: none; border-radius: 8px; background-image: linear-gradient(to right, light-dark(rgba(0,0,0,.16), rgba(255,255,255,.18)) 1px, transparent 1px), linear-gradient(to bottom, light-dark(rgba(0,0,0,.16), rgba(255,255,255,.18)) 1px, transparent 1px); background-size: calc(100% / 16) calc(100% / 16); }
  #kid-editor .kd-side { display: flex; flex-direction: column; gap: 10px; min-width: 190px; flex: 1; max-width: 260px; }
  #kid-editor .kd-group { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
  #kid-editor .kd-title { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); margin: 0 0 6px; }
  #kid-editor .kd-palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  #kid-editor .kd-swatch { height: 24px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; padding: 0; }
  #kid-editor .kd-swatch.on { border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 30%, transparent); }
  #kid-editor .kd-frames { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #kid-editor .kd-frame { width: 36px; height: 36px; image-rendering: pixelated; border: 2px solid var(--border); border-radius: 6px; cursor: pointer; padding: 0; background-image: repeating-conic-gradient(light-dark(rgba(0,0,0,.08), rgba(255,255,255,.12)) 0% 25%, transparent 0% 50%); background-size: 8px 8px; }
  #kid-editor .kd-frame.on { border-color: var(--primary); }
  #kid-editor .kd-preview { width: 104px; height: 104px; image-rendering: pixelated; border: 1px solid var(--border); border-radius: 8px; display: block; background-image: repeating-conic-gradient(light-dark(rgba(0,0,0,.08), rgba(255,255,255,.12)) 0% 25%, transparent 0% 50%); background-size: 12px 12px; }
  #kid-editor .kd-caption { font-size: 11px; color: var(--muted-foreground); margin-top: 4px; }
</style>
<div class="kd-tools">
  <button class="kd-tool on" data-tool="pencil" title="Pencil (draw)">&#9999;&#65039;</button>
  <button class="kd-tool" data-tool="eraser" title="Eraser">&#129530;</button>
  <button class="kd-tool" data-tool="fill" title="Fill (paint a whole area)">&#129421;</button>
  <button class="kd-tool" data-tool="pick" title="Pick a color from the drawing">&#127912;</button>
  <span style="width:8px"></span>
  <span class="kd-caption" style="margin:0">Brush:</span>
  <button class="kd-btn on" data-brush="1">1</button>
  <button class="kd-btn" data-brush="3">3</button>
  <span style="flex:1"></span>
  <button class="kd-btn" id="kd-undo" title="Undo">&#8630; Undo</button>
  <button class="kd-btn" id="kd-clear" title="Clear this frame">&#128465;&#65039; Clear</button>
  <button class="kd-btn" id="kd-play" title="Play the animation">&#9654;&#65039; Play</button>
</div>
<div class="kd-main">
  <div class="kd-canvas-wrap">
    <canvas id="kd-canvas" width="16" height="16"></canvas>
    <div class="kd-grid"></div>
  </div>
  <div class="kd-side">
    <div class="kd-group">
      <p class="kd-title">Colors</p>
      <div class="kd-palette" id="kd-palette"></div>
    </div>
    <div class="kd-group">
      <p class="kd-title">Frames</p>
      <div class="kd-frames" id="kd-frames"></div>
      <div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap">
        <button class="kd-btn" id="kd-add" title="Add a new frame">&#10133; Add</button>
        <button class="kd-btn" id="kd-dup" title="Copy this frame">&#10697; Copy</button>
        <button class="kd-btn" id="kd-del" title="Delete this frame">&#128465;&#65039; Del</button>
      </div>
    </div>
    <div class="kd-group">
      <p class="kd-title">Preview</p>
      <canvas class="kd-preview" id="kd-preview" width="16" height="16"></canvas>
    </div>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('kid-editor');
  var N = 16;
  var PAL = [['#1a1c2c','shadow'],['#5d275d','wine'],['#b13e53','red'],['#ef7d57','orange'],['#ffcd75','yellow'],['#a7f070','lime'],['#38b764','green'],['#257179','teal'],['#29366f','navy'],['#3b5dc9','blue'],['#41a6f6','sky'],['#73eff7','cyan'],['#f4f4f4','white'],['#94b0c2','silver'],['#566c86','gray'],['#333c57','dark']];
  function hex2rgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16), 255]; }
  var frames = [new Uint8ClampedArray(N*N*4)];
  var fi = 0, tool = 'pencil', sel = hex2rgb(PAL[3][0]), brush = 1, painting = false, playing = null;
  var undos = [];
  var main = root.querySelector('#kd-canvas'), mctx = main.getContext('2d');
  var prev = root.querySelector('#kd-preview'), pctx = prev.getContext('2d');
  function cur() { return frames[fi]; }
  function idx(x,y) { return (y*N+x)*4; }
  function set(x,y,c) { var i=idx(x,y), b=cur(); b[i]=c[0]; b[i+1]=c[1]; b[i+2]=c[2]; b[i+3]=c[3]; }
  function px(x,y) { var i=idx(x,y), b=cur(); return [b[i],b[i+1],b[i+2],b[i+3]]; }
  function drawAll() {
    mctx.putImageData(new ImageData(new Uint8ClampedArray(cur()), N, N), 0, 0);
    pctx.putImageData(new ImageData(new Uint8ClampedArray(cur()), N, N), 0, 0);
    drawChips();
  }
  function drawChips() {
    var box = root.querySelector('#kd-frames');
    var ch = box.querySelectorAll('.kd-frame');
    for (var i=0;i<ch.length;i++) {
      var c = ch[i];
      if (i < frames.length) {
        c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(frames[i]), N, N), 0, 0);
        c.classList.toggle('on', i === fi);
      }
    }
  }
  function flood(x,y,fill) {
    var b = cur(), target = px(x,y);
    if (target[0]===fill[0]&&target[1]===fill[1]&&target[2]===fill[2]&&target[3]===fill[3]) return;
    var stack = [[x,y]], seen = new Uint8Array(N*N);
    while (stack.length) {
      var p = stack.pop(), px2 = p[0], py = p[1], i = idx(px2,py);
      if (px2<0||px2>=N||py<0||py>=N||seen[i/4]) continue;
      seen[i/4] = 1;
      if (b[i]!==target[0]||b[i+1]!==target[1]||b[i+2]!==target[2]||b[i+3]!==target[3]) continue;
      b[i]=fill[0]; b[i+1]=fill[1]; b[i+2]=fill[2]; b[i+3]=fill[3];
      stack.push([px2+1,py],[px2-1,py],[px2,py+1],[px2,py-1]);
    }
  }
  function paintAt(x,y) {
    if (tool==='pencil') set(x,y,sel);
    else if (tool==='eraser') set(x,y,[0,0,0,0]);
  }
  function stroke(x,y) {
    if (tool==='fill') { flood(x,y,sel); }
    else if (tool==='pick') {
      var c = px(x,y);
      if (c[3] > 0) { sel = [c[0],c[1],c[2],255]; syncSel(); }
      tool = 'pencil'; syncTools();
    } else {
      var r = Math.floor(brush/2);
      for (var dy=-r; dy<=r; dy++) for (var dx=-r; dx<=r; dx++) {
        var X=x+dx, Y=y+dy;
        if (X>=0&&X<N&&Y>=0&&Y<N) paintAt(X,Y);
      }
    }
  }
  function cellOf(e) {
    var rect = main.getBoundingClientRect();
    var sx = rect.width/N, sy = rect.height/N;
    return [Math.floor((e.clientX-rect.left)/sx), Math.floor((e.clientY-rect.top)/sy)];
  }
  main.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    main.setPointerCapture(e.pointerId);
    var c = cellOf(e);
    if (c[0]<0||c[0]>=N||c[1]<0||c[1]>=N) return;
    if (tool!=='pick') { undos.push(Array.from(cur())); if (undos.length>40) undos.shift(); }
    stroke(c[0],c[1]);
    painting = true;
    drawAll();
  });
  main.addEventListener('pointermove', function(e) {
    if (!painting) return;
    var c = cellOf(e);
    if (c[0]<0||c[0]>=N||c[1]<0||c[1]>=N) return;
    stroke(c[0],c[1]);
    drawAll();
  });
  main.addEventListener('pointerup', function() { painting = false; });
  var tools = root.querySelectorAll('.kd-tool');
  function syncTools() {
    for (var i=0;i<tools.length;i++) tools[i].classList.toggle('on', tools[i].getAttribute('data-tool')===tool);
  }
  for (var i=0;i<tools.length;i++) {
    tools[i].addEventListener('click', function() {
      tool = this.getAttribute('data-tool');
      syncTools();
    });
  }
  var brushes = root.querySelectorAll('[data-brush]');
  for (var j=0;j<brushes.length;j++) {
    brushes[j].addEventListener('click', function() {
      brush = parseInt(this.getAttribute('data-brush'),10);
      for (var k=0;k<brushes.length;k++) brushes[k].classList.toggle('on', brushes[k]===this);
    });
  }
  var paletteBox = root.querySelector('#kd-palette');
  function buildPalette() {
    for (var i=0;i<PAL.length;i++) {
      (function(i){
        var b = document.createElement('button');
        b.className = 'kd-swatch';
        b.style.background = PAL[i][0];
        b.title = PAL[i][1];
        b.addEventListener('click', function() { sel = hex2rgb(PAL[i][0]); syncSel(); });
        paletteBox.appendChild(b);
      })(i);
    }
    syncSel();
  }
  function syncSel() {
    var sw = paletteBox.querySelectorAll('.kd-swatch');
    for (var i=0;i<sw.length;i++) {
      var c = hex2rgb(PAL[i][0]);
      sw[i].classList.toggle('on', c[0]===sel[0]&&c[1]===sel[1]&&c[2]===sel[2]);
    }
  }
  var frameBox = root.querySelector('#kd-frames');
  function rebuildChips() {
    frameBox.innerHTML = '';
    for (var i=0;i<frames.length;i++) {
      (function(i){
        var c = document.createElement('canvas');
        c.className = 'kd-frame';
        c.width = N; c.height = N;
        c.title = 'Frame ' + (i+1);
        c.addEventListener('click', function() { fi = i; if (playing) stopPlay(); drawAll(); });
        frameBox.appendChild(c);
      })(i);
    }
    drawChips();
  }
  function stopPlay() {
    if (playing) { clearInterval(playing); playing = null; }
    var p = root.querySelector('#kd-play');
    p.textContent = '▶️ Play';
  }
  root.querySelector('#kd-play').addEventListener('click', function() {
    if (playing) { stopPlay(); return; }
    var p = this;
    p.textContent = '⏸️ Pause';
    playing = setInterval(function() {
      if (frames.length < 2) return;
      fi = (fi + 1) % frames.length;
      drawAll();
    }, 300);
  });
  root.querySelector('#kd-undo').addEventListener('click', function() {
    if (!undos.length) return;
    cur().set(undos.pop());
    drawAll();
  });
  root.querySelector('#kd-clear').addEventListener('click', function() {
    undos.push(Array.from(cur()));
    cur().fill(0);
    drawAll();
  });
  root.querySelector('#kd-add').addEventListener('click', function() {
    frames.push(new Uint8ClampedArray(N*N*4));
    fi = frames.length - 1;
    rebuildChips(); drawAll();
  });
  root.querySelector('#kd-dup').addEventListener('click', function() {
    frames.splice(fi+1, 0, new Uint8ClampedArray(cur()));
    fi = fi + 1;
    rebuildChips(); drawAll();
  });
  root.querySelector('#kd-del').addEventListener('click', function() {
    if (frames.length < 2) return;
    frames.splice(fi, 1);
    fi = Math.min(fi, frames.length - 1);
    rebuildChips(); drawAll();
  });
  buildPalette();
  rebuildChips();
  drawAll();
})();
</script>
</div>
