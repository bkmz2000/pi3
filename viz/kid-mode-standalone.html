<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite editor — kid mode (v5)</title>
<style>
  :root { color-scheme: dark; --background:#0e1116; --foreground:#e8edf5; --card:#161b24; --card-foreground:#e8edf5; --muted-foreground:#8b98ab; --border:#2a3342; --primary:#4c9aff; --primary-foreground:#0b1220; }
  body { margin:0; padding:14px; background:var(--background); font-family:system-ui,sans-serif; color:var(--foreground); }
  #kid-editor { display:flex; flex-direction:column; gap:10px; padding:2px; }
  #kid-editor .kd-tools { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  #kid-editor .kd-tool { width:42px; height:42px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--foreground); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #kid-editor .kd-tool.on { background:var(--primary); color:var(--primary-foreground); border-color:var(--primary); }
  #kid-editor .kd-btn { height:34px; padding:0 12px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--foreground); font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  #kid-editor .kd-btn.on { border-color:var(--primary); color:var(--primary); background:color-mix(in srgb, var(--primary) 12%, transparent); }
  #kid-editor .kd-btn svg { flex:none; }
  #kid-editor .kd-main { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start; }
  #kid-editor .kd-canvas-wrap { position:relative; display:inline-block; }
  #kid-editor #kd-canvas { display:block; image-rendering:pixelated; border:1px solid var(--border); border-radius:8px; touch-action:none; user-select:none; cursor:crosshair; background-image:repeating-conic-gradient(light-dark(rgba(0,0,0,.08), rgba(255,255,255,.12)) 0% 25%, transparent 0% 50%); background-size:16px 16px; }
  #kid-editor .kd-grid { position:absolute; inset:1px; pointer-events:none; border-radius:8px; background-image:linear-gradient(to right, light-dark(rgba(0,0,0,.16), rgba(255,255,255,.18)) 1px, transparent 1px), linear-gradient(to bottom, light-dark(rgba(0,0,0,.16), rgba(255,255,255,.18)) 1px, transparent 1px); }
  #kid-editor .kd-ghost { position:absolute; display:none; pointer-events:none; border:1px solid rgba(255,255,255,.75); box-shadow:0 0 0 1px rgba(0,0,0,.5); border-radius:2px; }
  #kid-editor .kd-canvas-col { display:flex; flex-direction:column; gap:4px; align-items:flex-start; }
  #kid-editor .kd-onion-legend { font-size:11px; color:var(--muted-foreground); display:flex; gap:5px; align-items:center; }
  #kid-editor .kd-onion-legend .dot { width:10px; height:10px; border-radius:3px; display:inline-block; }
  #kid-editor .kd-sel { position:absolute; inset:1px; border:2px dashed var(--primary); border-radius:6px; pointer-events:none; display:none; }
  #kid-editor .kd-side { display:flex; flex-direction:column; gap:10px; min-width:220px; flex:1; max-width:320px; }
  #kid-editor .kd-group { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px; }
  #kid-editor .kd-title { font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted-foreground); margin:0 0 6px; display:flex; align-items:center; gap:6px; }
  #kid-editor .kd-palette { display:grid; grid-template-columns:repeat(8,1fr); gap:4px; }
  #kid-editor .kd-swatch { height:26px; border-radius:6px; border:2px solid transparent; cursor:pointer; padding:0; }
  #kid-editor .kd-swatch.on { border-color:var(--primary); box-shadow:0 0 0 2px color-mix(in srgb, var(--primary) 30%, transparent); }
  #kid-editor .kd-custom .kd-swatch { width:34px; height:34px; }
  #kid-editor .kd-current { width:26px; height:26px; border-radius:6px; border:2px solid var(--primary); flex:none; }
  #kid-editor .kd-custom { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  #kid-editor .kd-custom-label { font-size:11px; color:var(--muted-foreground); margin-top:6px; }
  #kid-editor .kd-mixer { border:1px solid var(--border); border-radius:8px; padding:6px; margin-top:6px; }
  #kid-editor .kd-mixer-row { display:flex; gap:6px; align-items:center; margin:4px 0; flex-wrap:wrap; }
  #kid-editor .kd-slot { width:24px; height:24px; border-radius:6px; border:2px solid var(--border); cursor:pointer; background:repeating-conic-gradient(rgba(0,0,0,.2) 0% 25%, transparent 25% 50%); background-size:6px 6px; padding:0; }
  #kid-editor .kd-slot.pick { border-color:var(--primary); box-shadow:0 0 0 2px color-mix(in srgb, var(--primary) 35%, transparent); }
  #kid-editor .kd-ramp { display:flex; gap:3px; margin:4px 0; }
  #kid-editor .kd-ramp .kd-swatch { flex:1; height:24px; min-width:0; }
  #kid-editor .kd-sizes { display:flex; gap:6px; flex-wrap:wrap; }
  #kid-editor .kd-size { height:30px; min-width:40px; padding:0 8px; border-radius:7px; border:1px solid var(--border); background:var(--card); color:var(--foreground); font-size:13px; cursor:pointer; }
  #kid-editor .kd-size.on { border-color:var(--primary); color:var(--primary); background:color-mix(in srgb, var(--primary) 12%, transparent); }
  #kid-editor .kd-anims { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  #kid-editor .kd-anim { height:30px; padding:0 10px; border-radius:7px; border:1px solid var(--border); background:var(--card); color:var(--foreground); font-size:13px; cursor:pointer; }
  #kid-editor .kd-anim.on { border-color:var(--primary); color:var(--primary); background:color-mix(in srgb, var(--primary) 12%, transparent); }
  #kid-editor .kd-anim-actions { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  #kid-editor .kd-frames { display:flex; gap:6px; align-items:center; flex-wrap:wrap; min-height:44px; }
  #kid-editor .kd-frame { width:40px; height:40px; image-rendering:pixelated; border:2px solid var(--border); border-radius:6px; cursor:pointer; padding:0; background-image:repeating-conic-gradient(light-dark(rgba(0,0,0,.08), rgba(255,255,255,.12)) 0% 25%, transparent 0% 50%); background-size:8px 8px; }
  #kid-editor .kd-frame.on { border-color:var(--primary); }
  #kid-editor .kd-frame.drag { opacity:.45; }
  #kid-editor .kd-frame.over { border-color:var(--primary); box-shadow:0 0 0 2px color-mix(in srgb, var(--primary) 30%, transparent); }
  #kid-editor .kd-preview { width:128px; height:128px; image-rendering:pixelated; border:1px solid var(--border); border-radius:8px; display:block; background-image:repeating-conic-gradient(light-dark(rgba(0,0,0,.08), rgba(255,255,255,.12)) 0% 25%, transparent 0% 50%); background-size:12px 12px; }
  #kid-editor .kd-caption { font-size:11px; color:var(--muted-foreground); margin-top:4px; }
  #kid-editor .kd-modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:10; }
  #kid-editor .kd-modal[hidden] { display:none; }
  #kid-editor .kd-modal-box { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; max-width:340px; width:100%; }
  #kid-editor .kd-input { height:34px; padding:0 10px; border-radius:8px; border:1px solid var(--border); background:var(--background); color:var(--foreground); width:100%; box-sizing:border-box; margin-bottom:8px; font-size:14px; }
  #kid-editor .kd-msg { font-size:12px; color:var(--muted-foreground); margin:0 0 8px; min-height:14px; }
  #kid-editor .kd-toast { position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--primary); color:var(--primary-foreground); padding:8px 16px; border-radius:999px; font-size:13px; font-weight:600; z-index:30; opacity:0; transition:opacity .15s; pointer-events:none; }
  #kid-editor .kd-toast.show { opacity:1; }
</style>
</head>
<body>
<div id="kid-editor">
  <div class="kd-tools">
    <button class="kd-tool on" data-tool="pencil" title="Pencil (B) — hold Shift to draw a straight line"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></button>
    <button class="kd-tool" data-tool="eraser" title="Eraser (E) — hold Shift for a straight line"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
    <button class="kd-tool" data-tool="fill" title="Fill (G)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg></button>
    <button class="kd-tool" data-tool="pick" title="Pick color (I)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 2 4 4L10 18l-4 4-4-4 4-4L18 2Z"/><path d="M6 14l4 4"/></svg></button>
    <button class="kd-tool" data-tool="line" title="Line (L)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19 19 5"/></svg></button>
    <button class="kd-tool" data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="2"/></svg></button>
    <button class="kd-tool" data-tool="circle" title="Circle (C)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg></button>
    <span style="width:8px"></span>
    <span class="kd-caption" style="margin:0">Brush:</span>
    <button class="kd-btn" data-brush="1">1</button>
    <button class="kd-btn on" data-brush="3">3</button>
    <button class="kd-btn" data-brush="5">5</button>
    <span style="flex:1"></span>
    <button class="kd-btn on" id="kd-grid" title="Toggle grid"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>Grid</button>
    <button class="kd-btn on" id="kd-onion" title="Onion skin — blue outline = previous frame, pink outline = next frame (only where pixels moved)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="8" opacity=".55"/><circle cx="12" cy="12" r="11" opacity=".3"/></svg>Onion</button>
    <button class="kd-btn" id="kd-zoomout" title="Zoom out"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14" opacity="0"/><path d="M5 12h14"/></svg></button>
    <span class="kd-caption" id="kd-zoomlabel" style="min-width:38px; text-align:center; margin:0">100%</span>
    <button class="kd-btn" id="kd-zoomin" title="Zoom in"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="kd-btn" id="kd-undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>Undo</button>
    <button class="kd-btn" id="kd-redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>Redo</button>
    <button class="kd-btn" id="kd-clear" title="Clear this frame"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>Clear</button>
    <button class="kd-btn" id="kd-play" title="Play the animation"><span id="kd-ico-play"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 4.5v15a1 1 0 0 0 1.5.87l12-7.5a1 1 0 0 0 0-1.74l-12-7.5A1 1 0 0 0 6 4.5Z"/></svg></span><span id="kd-ico-pause" style="display:none"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></span>Play</button>
  </div>
  <div class="kd-main">
    <div class="kd-canvas-col">
      <div class="kd-canvas-wrap">
        <canvas id="kd-canvas"></canvas>
        <div class="kd-grid" id="kd-grid"></div>
        <div class="kd-sel" id="kd-sel"></div>
        <div class="kd-ghost" id="kd-ghost"></div>
      </div>
      <div class="kd-onion-legend" id="kd-onion-legend" hidden><span class="dot" style="background:#41a6f6"></span> outline = previous frame&nbsp;&nbsp;<span class="dot" style="background:#ff7fa8"></span> outline = next frame</div>
    </div>
    <div class="kd-side">
      <div class="kd-group">
        <p class="kd-title">Colors <span style="flex:1"></span> <span class="kd-caption" style="margin:0">current</span> <span class="kd-current" id="kd-current"></span></p>
        <div class="kd-palette" id="kd-palette"></div>
        <button class="kd-btn" id="kd-mix-toggle" style="width:100%; justify-content:center; margin-top:6px;"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.5"/></svg>Mix colors</button>
        <div class="kd-mixer" id="kd-mixer" hidden>
          <div class="kd-mixer-row">
            <span class="kd-caption" style="margin:0">1st color</span>
            <button class="kd-slot" id="kd-slot-a" title="Pick the 1st color"></button>
            <span class="kd-caption" style="margin:0">2nd color</span>
            <button class="kd-slot" id="kd-slot-b" title="Pick the 2nd color"></button>
            <span class="kd-caption" id="kd-mix-hint" style="margin:0"></span>
          </div>
          <div class="kd-ramp" id="kd-ramp"></div>
        </div>
        <p class="kd-custom-label" id="kd-custom-label" hidden>My colors</p>
        <div class="kd-custom" id="kd-custom"></div>
      </div>
      <div class="kd-group">
        <p class="kd-title">Canvas size</p>
        <div class="kd-sizes" id="kd-sizes"></div>
      </div>
      <div class="kd-group">
        <p class="kd-title">Animations</p>
        <div class="kd-anims" id="kd-anims"></div>
        <div class="kd-anim-actions">
          <button class="kd-btn" id="kd-anim-add" title="Add a new animation"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New</button>
          <button class="kd-btn" id="kd-anim-rename" title="Rename this animation"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>Rename</button>
          <button class="kd-btn" id="kd-anim-del" title="Delete this animation"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>Delete</button>
        </div>
      </div>
      <div class="kd-group">
        <p class="kd-title" id="kd-frames-title">Frames <span class="kd-caption" style="margin:0">(drag to reorder)</span></p>
        <div class="kd-frames" id="kd-frames"></div>
        <div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap">
          <button class="kd-btn" id="kd-add" title="Add a new frame"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</button>
          <button class="kd-btn" id="kd-dup" title="Copy this frame"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>Copy</button>
          <button class="kd-btn" id="kd-del" title="Delete this frame"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>Del</button>
        </div>
      </div>
      <div class="kd-group">
        <p class="kd-title">Preview</p>
        <canvas class="kd-preview" id="kd-preview"></canvas>
      </div>
    </div>
  </div>
  <div class="kd-modal" id="kd-modal" hidden>
    <div class="kd-modal-box">
      <p style="font-size:14px; margin:0 0 4px;" id="kd-modal-title">Change canvas size?</p>
      <p class="kd-caption" style="margin:0 0 12px;">Your drawing keeps its look — choose how.</p>
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <button class="kd-btn" id="kd-scale" style="border-color:var(--primary); color:var(--primary);">Scale drawing</button>
        <button class="kd-btn" id="kd-keep">Keep as-is</button>
        <button class="kd-btn" id="kd-cancel">Cancel</button>
      </div>
    </div>
  </div>
  <div class="kd-modal" id="kd-name-modal" hidden>
    <div class="kd-modal-box">
      <p style="font-size:14px; margin:0 0 8px;" id="kd-name-title">Animation name</p>
      <input class="kd-input" id="kd-name-input" type="text" placeholder="e.g. walk" maxlength="24">
      <p class="kd-msg" id="kd-name-msg"></p>
      <div style="display:flex; gap:8px; justify-content:flex-end">
        <button class="kd-btn" id="kd-name-cancel">Cancel</button>
        <button class="kd-btn" id="kd-name-ok" style="border-color:var(--primary); color:var(--primary);">OK</button>
      </div>
    </div>
  </div>
  <div class="kd-toast" id="kd-toast"></div>
</div>
<script>
(function () {
  var root = document.getElementById('kid-editor');
  var SIZES = [16, 32, 64, 128];
  var SIZE = 64;
  var PAL = [['#1a1c2c','shadow'],['#5d275d','wine'],['#b13e53','red'],['#ef7d57','orange'],['#ffcd75','yellow'],['#a7f070','lime'],['#38b764','green'],['#257179','teal'],['#29366f','navy'],['#3b5dc9','blue'],['#41a6f6','sky'],['#73eff7','cyan'],['#f4f4f4','white'],['#94b0c2','silver'],['#566c86','gray'],['#333c57','dark']];
  function hex2rgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16), 255]; }
  function rgb2css(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
  function mixRGB(a, b, t) { return [Math.round(a[0]+(b[0]-a[0])*t), Math.round(a[1]+(b[1]-a[1])*t), Math.round(a[2]+(b[2]-a[2])*t), 255]; }
  function sameRGB(a, b) { return a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2]; }
  var SHAPES = { line: 1, rect: 1, circle: 1 };
  var anims = { idle: [new Uint8ClampedArray(SIZE*SIZE*4)] };
  var active = 'idle';
  var fi = 0, tool = 'pencil', sel = hex2rgb(PAL[3][0]), brush = 3, painting = false, playing = null, undos = [], redos = [], pendingSize = null, pendingName = null, shapeStart = null, shapeEnd = null, shiftLine = null;
  var showGrid = true, onion = true, zoom = 1, allSelected = false, clip = null;
  var mixOpen = false, mixA = null, mixB = null, pickSlot = 'A';

          c.classList.add('drag');
          e.preventDefault();
        });
        c.addEventListener('pointermove', function(e) {
          if (dragIdx == null) return;
          if (dragStart && (Math.abs(e.clientX-dragStart.x) + Math.abs(e.clientY-dragStart.y)) > 4) dragMoved = true;
        });
        c.addEventListener('pointerenter', function() {
          if (dragIdx != null && dragIdx !== i) {
            overIdx = i;
            var ch = frameBox.querySelectorAll('.kd-frame');
            for (var k=0;k<ch.length;k++) ch[k].classList.toggle('over', k === overIdx && dragIdx !== k);
          }
        });
        c.addEventListener('pointerup', finishDrag);
        frameBox.appendChild(c);
      })(i);
    }
    drawChips();
  }
  function finishDrag() {
    if (dragIdx != null && overIdx != null && overIdx !== dragIdx && dragMoved) {
      var f = frames();
      var item = f.splice(dragIdx, 1)[0];
      f.splice(overIdx, 0, item);
      fi = overIdx;
      suppressClick = true;
      rebuildChips(); rebuildAnims(); drawAll();
    }
    dragIdx = null; overIdx = null; dragMoved = false; dragStart = null;
    var ch = frameBox.querySelectorAll('.kd-frame');
    for (var k=0;k<ch.length;k++) ch[k].classList.remove('drag', 'over');
  }
  document.addEventListener('pointerup', finishDrag);
  function stopPlay() {
    if (playing) { clearInterval(playing); playing = null; }
    root.querySelector('#kd-ico-play').style.display = '';
    root.querySelector('#kd-ico-pause').style.display = 'none';
  }
  root.querySelector('#kd-play').addEventListener('click', function() {
    if (playing) { stopPlay(); return; }
    root.querySelector('#kd-ico-play').style.display = 'none';
    root.querySelector('#kd-ico-pause').style.display = '';
    playing = setInterval(function() {
      if (frames().length < 2) return;
      fi = (fi + 1) % frames().length;
      drawAll();
    }, 250);
  });
  root.querySelector('#kd-add').addEventListener('click', function() {
    pushUndo();
    frames().push(new Uint8ClampedArray(SIZE*SIZE*4));
    fi = frames().length - 1;
    rebuildChips(); rebuildAnims(); drawAll();
  });
  root.querySelector('#kd-dup').addEventListener('click', function() {
    pushUndo();
    frames().splice(fi+1, 0, new Uint8ClampedArray(cur()));
    fi = fi + 1;
    rebuildChips(); rebuildAnims(); drawAll();
  });
  root.querySelector('#kd-del').addEventListener('click', function() {
    if (frames().length < 2) return;
    pushUndo();
    frames().splice(fi, 1);
    fi = Math.min(fi, frames().length - 1);
    rebuildChips(); rebuildAnims(); drawAll();
  });
  var modal = root.querySelector('#kd-modal');
  function askResize(ns) {
    pendingSize = ns;
    root.querySelector('#kd-modal-title').textContent = 'Change canvas size to ' + ns + ' x ' + ns + '?';
    modal.hidden = false;
  }
  function hideModal() { modal.hidden = true; pendingSize = null; }
  root.querySelector('#kd-scale').addEventListener('click', function() { if (pendingSize) doResize(pendingSize, true); });
  root.querySelector('#kd-keep').addEventListener('click', function() { if (pendingSize) doResize(pendingSize, false); });
  root.querySelector('#kd-cancel').addEventListener('click', hideModal);
  var nameModal = root.querySelector('#kd-name-modal');
  var nameInput = root.querySelector('#kd-name-input');
  function showNameModal(title, prefill, mode) {
    pendingName = mode;
    root.querySelector('#kd-name-title').textContent = title;
    nameInput.value = prefill || '';
    root.querySelector('#kd-name-msg').textContent = '';
    nameModal.hidden = false;
    nameInput.focus();
  }
  function hideNameModal() { nameModal.hidden = true; pendingName = null; }
  function commitName() {
    var val = nameInput.value.trim();
    if (!val) { root.querySelector('#kd-name-msg').textContent = 'Type a name first.'; return; }
    if (pendingName === 'add') {
      if (anims[val]) { root.querySelector('#kd-name-msg').textContent = 'An animation named "' + val + '" already exists.'; return; }
      anims[val] = [new Uint8ClampedArray(SIZE*SIZE*4)];
      active = val; fi = 0;
      hideNameModal(); rebuildAnims(); rebuildChips(); drawAll();
    } else if (pendingName === 'rename') {
      if (anims[val] && val !== active) { root.querySelector('#kd-name-msg').textContent = 'An animation named "' + val + '" already exists.'; return; }
      if (val !== active) { anims[val] = anims[active]; delete anims[active]; active = val; }
      hideNameModal(); rebuildAnims(); rebuildChips(); drawAll();
    }
  }
  root.querySelector('#kd-anim-add').addEventListener('click', function() { showNameModal('New animation', '', 'add'); });
  root.querySelector('#kd-anim-rename').addEventListener('click', function() { showNameModal('Rename animation', active, 'rename'); });
  root.querySelector('#kd-anim-del').addEventListener('click', function() {
    var names = Object.keys(anims);
    if (names.length < 2) return;
    delete anims[active];
    active = Object.keys(anims)[0];
    fi = 0;
    rebuildAnims(); rebuildChips(); drawAll();
  });
  root.querySelector('#kd-name-ok').addEventListener('click', commitName);
  root.querySelector('#kd-name-cancel').addEventListener('click', hideNameModal);
  nameInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') commitName(); });
  function scaleFrame(buf, ns, doScale) {
    var nb = new Uint8ClampedArray(ns*ns*4);
    if (doScale) {
      for (var y=0;y<ns;y++) for (var x=0;x<ns;x++) {
        var sx = Math.floor(x*SIZE/ns), sy = Math.floor(y*SIZE/ns);
        var si = (sy*SIZE+sx)*4, di = (y*ns+x)*4;
        nb[di]=buf[si]; nb[di+1]=buf[si+1]; nb[di+2]=buf[si+2]; nb[di+3]=buf[si+3];
      }
    } else {
      var mw = Math.min(SIZE, ns), mh = Math.min(SIZE, ns);
      for (var y=0;y<mh;y++) for (var x=0;x<mw;x++) {
        var si = (y*SIZE+x)*4, di = (y*ns+x)*4;
        nb[di]=buf[si]; nb[di+1]=buf[si+1]; nb[di+2]=buf[si+2]; nb[di+3]=buf[si+3];
      }
    }
    return nb;
  }
  function doResize(ns, doScale) {
    var names = Object.keys(anims);
    for (var a=0;a<names.length;a++) {
      var nf = [];
      for (var i=0;i<anims[names[a]].length;i++) nf.push(scaleFrame(anims[names[a]][i], ns, doScale));
      anims[names[a]] = nf;
    }
    SIZE = ns;
    fi = Math.min(fi, frames().length - 1);
    undos = []; redos = [];
    main.width = SIZE; main.height = SIZE;
    prev.width = SIZE; prev.height = SIZE;
    applyZoom();
    rebuildSizeChips(); rebuildAnims(); rebuildChips(); drawAll();
    hideModal();
  }
  main.width = SIZE; main.height = SIZE;
  prev.width = SIZE; prev.height = SIZE;
  applyZoom();
  root.querySelector('#kd-onion-legend').hidden = !onion;
  buildPalette(); buildSizeChips(); rebuildAnims(); rebuildChips(); drawAll();
})();
</script>
</body>
</html>
